<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login — Jobs Era</title><meta name="robots" content="noindex,nofollow"><link rel="stylesheet" href="css/style.css"></head>
<body><header><a class="brandLogo" href="index.html"><img src="assets/jobs-era-logo.png" alt="Jobs Era"></a><nav><a href="index.html">Home</a></nav></header>
<main class="authPage"><section class="panel authBox">
<div class="authTabs"><button id="loginTab" class="active">Login</button><button id="signupTab">Create Account</button></div>
<form id="userLogin"><h1>Welcome back</h1><p>Login to join discussions on Jobs Era.</p><input id="loginEmail" type="email" required placeholder="Email"><input id="loginPassword" type="password" required placeholder="Password"><button class="btn">Login</button></form>
<form id="userSignup" class="hidden"><h1>Create account</h1><p>Your name will automatically appear with your comments.</p><input id="signupName" required placeholder="Full name"><input id="signupEmail" type="email" required placeholder="Email"><input id="signupPassword" type="password" minlength="6" required placeholder="Password (minimum 6 characters)"><button class="btn">Create Account</button></form>
<p id="authMessage" class="authMessage"></p></section></main><script src="js/app.js"></script></body></html>
